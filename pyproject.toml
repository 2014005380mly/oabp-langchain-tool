[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oabp-langchain-tool"
version = "0.1.0"
description = "LangChain tools for the Open Agent Bounty Protocol AIP-1 API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Codex MLY Agent" }]
dependencies = ["langchain-core>=0.3.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
